<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Scratch Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@500&display=swap">
<style>
/* Layout: full-bleed contour field (3x3 lattice of samples) with a thin chip bar at top and bottom. Single look by choice. */
:root{
  --field:#0f8d40; --lime:#c4ec52; --ink:#eaf6c8;
  --chip:rgba(6,18,10,.78); --chip-line:rgba(196,236,82,.35); --hot:#ff6a6e;
  --ui:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--field);color:var(--lime)}
body{margin:0;overflow:hidden;font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.lbl{position:fixed;transform:translate(-50%,0);pointer-events:none;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.16em;
  color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.75);white-space:nowrap;text-align:center;transition:opacity .25s}
.lbl small{display:block;font-size:9px;font-weight:500;letter-spacing:.06em;opacity:.7}
.lbl.live{color:#fff8d0}
.top,.bottom{position:fixed;left:0;right:0;display:flex;gap:8px;align-items:center;pointer-events:none;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 12px);justify-content:space-between}
.bottom{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);justify-content:center;flex-wrap:wrap}
.top>*,.bottom>*{pointer-events:auto}
.stat{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;background:var(--chip);border:1px solid var(--chip-line);
  border-radius:6px;padding:7px 10px;font-variant-numeric:tabular-nums;display:flex;gap:10px;align-items:center}
.stat b{font-weight:600;color:var(--ink)}
.stat .combo{color:var(--lime)}
.stat .combo.hot{color:var(--hot)}
.grp{display:flex;gap:4px;align-items:center;background:var(--chip);border:1px solid var(--chip-line);border-radius:999px;padding:4px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.grp .cap{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;opacity:.6;padding:0 6px 0 8px}
.chip{font:600 11px var(--mono);letter-spacing:.08em;color:var(--ink);background:transparent;border:0;border-radius:999px;padding:7px 11px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#3e4a2c}
.chip[aria-pressed="true"]{background:rgba(196,236,82,.14)}
.chip[aria-pressed="true"] .dot{background:var(--lime);box-shadow:0 0 6px var(--lime)}
.chip:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
.chip:disabled{opacity:.35;cursor:default}
.bpm{font:600 11px var(--mono);min-width:44px;text-align:center;color:var(--lime);font-variant-numeric:tabular-nums}
.solo{background:var(--chip);border:1px solid var(--chip-line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,440px);box-sizing:border-box;background:rgba(6,18,10,.9);
  border:1px solid var(--chip-line);border-radius:14px;padding:16px 18px;font-size:13.5px;line-height:1.65;color:var(--ink);text-align:left}
.hint h2{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.18em;color:var(--lime)}
.hint p{margin:0 0 6px}
.hint b{color:var(--lime);font-weight:500}
.hint kbd{font:500 11px var(--mono);border:1px solid rgba(234,246,200,.35);border-radius:4px;padding:0 4px}
.hint button{margin-top:8px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);font-size:12.5px;background:var(--chip);border:1px solid var(--chip-line);
  border-radius:999px;padding:6px 13px;opacity:0;transition:opacity .3s;pointer-events:none;color:var(--ink);white-space:nowrap}
.toast.show{opacity:1}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.stat span{white-space:nowrap}
@media (max-width:560px){.grp .cap{display:none}.chip{padding:7px 9px}.stat b{display:none}}
</style>

</head>
<body>
<canvas id="c" aria-label="샘플을 잡고 끌어서 스크래치하는 등고선 화면"></canvas>
<div id="labels"></div>

<div class="top">
  <div class="stat" aria-live="polite"><b>SCRATCH FIELD</b><span id="bpmStat">90 BPM</span><span class="combo" id="combo">COMBO 0</span></div>
  <div class="grp">
    <button class="chip" id="soundBtn" aria-pressed="false"><span class="dot"></span><span>소리 켜기</span></button>
    <button class="chip" id="helpBtn" aria-label="도움말">?</button>
  </div>
</div>

<div class="bottom">
  <div class="grp" role="group" aria-label="배경 음악">
    <span class="cap">BGM</span>
    <button class="chip" id="bgmBtn" aria-pressed="false"><span class="dot"></span><span>재생</span></button>
    <button class="chip" id="srcLoop" aria-pressed="true">LOOP</button>
    <button class="chip" id="srcMy" aria-pressed="false" disabled>MY</button>
    <button class="chip" id="bpmDown" aria-label="BPM 낮추기">−</button><span class="bpm" id="bpmOut">90</span><button class="chip" id="bpmUp" aria-label="BPM 올리기">+</button>
  </div>
  <div class="grp" role="group" aria-label="스크래치 효과">
    <span class="cap">SFX</span>
    <button class="chip" data-fx="reverb" aria-pressed="false"><span class="dot"></span>REVERB</button>
    <button class="chip" data-fx="delay" aria-pressed="false"><span class="dot"></span>DELAY</button>
    <button class="chip" data-fx="filter" aria-pressed="false"><span class="dot"></span>FILTER</button>
    <button class="chip" data-fx="crush" aria-pressed="false"><span class="dot"></span>CRUSH</button>
  </div>
  <label class="chip solo" for="file" id="fileLbl"><span class="dot"></span>＋ 내 음악</label>
  <input class="vh" type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aac">
</div>

<div class="hint" id="hint">
  <h2>HOW TO PLAY</h2>
  <p><b>원 하나를 눌러 샘플을 집고, 손을 떼지 않고 앞뒤로 끌면</b> 그 샘플이 스크래치돼요. 처음 끄는 방향이 앞으로 재생되는 방향이에요.</p>
  <p>톡 치면 샘플이 한 번 울려요. 모서리 원은 드럼이라 손가락 드럼처럼 칠 수 있어요.</p>
  <p>스크래치하는 동안 <b>다른 손가락으로 빈 곳</b>을 누르고 있으면 소리가 끊겨요(CUT). 비트의 8분음표에 맞춰 방향을 바꾸면 COMBO가 올라가요.</p>
  <p>키보드: 샘플 <kbd>1</kbd>–<kbd>9</kbd> · CUT <kbd>Space</kbd></p>
  <button class="chip solo" id="startBtn"><span class="dot"></span>시작하기 · BGM 켜기</button>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const REV=1.8;               // seconds of sample per voice buffer
let SR=48000;

/* =============== sample synthesis (all scratchable buffers) =============== */
function normalize(a,peak=.92){let m=0;for(let i=0;i<a.length;i++){const v=Math.abs(a[i]);if(v>m)m=v;}if(m>0){const g=peak/m;for(let i=0;i<a.length;i++)a[i]*=g;}return a;}
const PRE=.05;   // silence before each sound (the cue point)
function vowel(sr,L,{f0a,f0b,dur,F,breath=.05,vib=3.5}){
  const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(dur*sr),amps=new Float32Array(56);let K=0,ph=0,seed=7;
  for(let i=0;i<n;i++){const t=i/sr,x=t/dur,f0=f0a+(f0b-f0a)*x+vib*Math.sin(2*Math.PI*5.3*t);
    if(i%64===0){const Fx=F(x);K=Math.min(54,Math.floor(5600/f0));for(let k=1;k<=K;k++){const fk=k*f0;let a=0;for(const [fc,bw,g] of Fx){const y=(fk-fc)/bw;a+=g*Math.exp(-y*y);}amps[k]=a/Math.sqrt(k);}}
    ph+=f0/sr;if(ph>1)ph-=1;let s=0;for(let k=1;k<=K;k++)s+=amps[k]*Math.sin(6.283185307*k*ph);
    seed=(seed*16807)%2147483647;s+=((seed/2147483647)-.5)*breath;
    o[st+i]=s*Math.min(1,t/.018)*(t>dur-.2?(dur-t)/.2:1);}
  return normalize(o);
}
const lerpF=(A,B,x)=>A.map((a,i)=>[a[0]+(B[i][0]-a[0])*x,a[1]+(B[i][1]-a[1])*x,a[2]+(B[i][2]-a[2])*x]);
const F_AH=[[760,140,1],[1190,160,.55],[2520,230,.3],[3450,320,.12]], F_EH=[[530,120,1],[1840,170,.5],[2480,220,.3],[3400,300,.12]], F_OH=[[500,120,1],[880,140,.6],[2500,230,.2],[3300,300,.1]];
function genAhh(sr,L){return vowel(sr,L,{f0a:195,f0b:150,dur:.85,F:()=>F_AH});}
function genYeah(sr,L){return vowel(sr,L,{f0a:170,f0b:215,dur:.62,F:x=>lerpF(F_EH,F_AH,Math.min(1,x*1.6)),vib:2});}
function genStab(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(.6*sr),notes=[130.81,261.63,311.13,392,466.16,523.25];let y=0,y2=0;
  for(let i=0;i<n;i++){const t=i/sr;let s=0;for(let j=0;j<notes.length;j++){const f=notes[j]*(1+(j%2?.004:-.003));s+=2*((t*f)%1)-1;}s/=notes.length;
    const cut=500+5200*Math.exp(-t/.11),a=1-Math.exp(-6.283*cut/sr);y+=a*(s-y);y2+=a*(y-y2);o[st+i]=y2*Math.min(1,t/.003)*Math.exp(-t/.2);}
  return normalize(o);}
function genHorn(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),dur=.7,n=Math.floor(dur*sr);let y=0,y2=0,p1=0,p2=0;
  for(let i=0;i<n;i++){const t=i/sr,bend=t<.07?Math.pow(2,-2*(1-t/.07)/12):1,f=233.08*bend*(1+.007*Math.sin(2*Math.PI*5.6*Math.max(0,t-.15)));
    p1=(p1+f/sr)%1;p2=(p2+f*1.005/sr)%1;const s=(2*p1-1)+(2*p2-1)*.8,env=Math.min(1,t/.035)*(t>dur-.15?(dur-t)/.15:1),cut=700+2600*env*(1-.4*t),a=1-Math.exp(-6.283*cut/sr);
    y+=a*(s-y);y2+=a*(y-y2);o[st+i]=y2*env;}
  return normalize(o);}
let rs=12345;const rnd=()=>{rs=(rs*16807)%2147483647;return rs/2147483647*2-1;};
function genKick(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(.5*sr);let ph=0;
  for(let i=0;i<n;i++){const t=i/sr,f=44+116*Math.exp(-t/.035);ph+=f/sr;o[st+i]=Math.sin(2*Math.PI*ph)*Math.exp(-t/.16)+(t<.006?rnd()*.4*(1-t/.006):0);}
  return normalize(o,.95);}
function genSnare(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(.3*sr);let ph=0,b1=0,b2=0,prev=0;
  for(let i=0;i<n;i++){const t=i/sr;ph+=(150+60*Math.exp(-t/.02))/sr;const nz=rnd();const hp=nz-prev;prev=nz;b1+=.35*(hp-b1);b2+=.5*(b1-b2);
    o[st+i]=Math.sin(2*Math.PI*ph)*.55*Math.exp(-t/.06)+b1*1.1*Math.exp(-t/.09);}
  return normalize(o);}
function genClap(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(.35*sr);let b=0,prev=0;
  for(let i=0;i<n;i++){const t=i/sr;const nz=rnd(),hp=nz-prev;prev=nz;b+=.45*(hp-b);
    let env=0;for(let k=0;k<3;k++){const tk=t-k*.011;if(tk>=0&&tk<.011)env=Math.max(env,Math.exp(-tk/.004));}env=Math.max(env,t>.033?.6*Math.exp(-(t-.033)/.09):0);
    o[st+i]=b*env;}
  return normalize(o);}
function genHat(sr,L){const o=new Float32Array(L),st=Math.floor(PRE*sr),n=Math.floor(.12*sr);let p1=0,p2=0;
  for(let i=0;i<n;i++){const t=i/sr,nz=rnd(),h1=nz-p1;p1=nz;const h2=h1-p2;p2=h1;o[st+i]=h2*Math.exp(-t/.035);}
  return normalize(o,.7);}
const GEN={AHH:genAhh,YEAH:genYeah,STAB:genStab,HORN:genHorn,KICK:genKick,SNARE:genSnare,CLAP:genClap,HAT:genHat};

/* =============== multi-voice scratch engine (AudioWorklet, ScriptProcessor fallback) =============== */
const CORE_SRC=`
class Voice{
  constructor(sr){this.sr=sr;this.buf=new Float32Array(2);this.L=2;this.pos=0;this.vel=0;this.grab=false;this.hand=0;this.hv=0;this.motor=false;
    this.spin=1/(sr*.08);this.kp=1/(sr*.010);this.lp=0;this.g=1;}
  msg(m){
    if(m.type==='buf'){this.buf=m.data;this.L=m.data.length;}
    else if(m.type==='hand'){this.grab=m.grab;this.hand=m.hand;this.hv=m.hv;}
    else if(m.type==='motor'){this.motor=m.on;}
    else if(m.type==='setpos'){this.pos=m.pos;this.vel=m.vel||0;this.hand=m.pos;}
  }
  add(out,fader){
    const b=this.buf,L=this.L,n=out.length;
    for(let i=0;i<n;i++){
      if(this.grab){this.hand+=this.hv;let tv=this.hv+(this.hand-this.pos)*this.kp;if(tv>14)tv=14;else if(tv<-14)tv=-14;this.vel+=(tv-this.vel)*.014;}
      else{if(this.motor&&this.pos>=L-1)this.motor=false;const tv=this.motor?1:0;this.vel+=(tv-this.vel)*this.spin*(Math.abs(tv-this.vel)>.5?3:1);}
      this.pos+=this.vel;
      let s=0;const p=this.pos;
      if(p>=0&&p<L-1){const i0=p|0,fr=p-i0;s=b[i0]+(b[i0+1]-b[i0])*fr;}
      const av=Math.abs(this.vel),k=av<.4?.22+av*1.9:1;this.lp+=(s-this.lp)*k;
      this.g+=(fader-this.g)*.06;
      out[i]+=this.lp*this.g*.8;
    }
  }
}
class Mix{
  constructor(sr,n){this.v=[];for(let i=0;i<n;i++)this.v.push(new Voice(sr));this.fader=1;}
  msg(m){if(m.type==='fader')this.fader=m.v;else if(this.v[m.i])this.v[m.i].msg(m);}
  process(out){out.fill(0);for(const v of this.v)v.add(out,this.fader);}
  report(){const r=new Float32Array(this.v.length*2);this.v.forEach((v,i)=>{r[i*2]=v.pos;r[i*2+1]=v.vel;});return r;}
}`;
const NV=4;
const WORKLET_SRC=CORE_SRC+`
class P extends AudioWorkletProcessor{
  constructor(){super();this.m=new Mix(sampleRate,${NV});this.k=0;this.port.onmessage=e=>this.m.msg(e.data);}
  process(i,o){const ch=o[0]&&o[0][0];if(ch)this.m.process(ch);if((++this.k&1)===0)this.port.postMessage(this.m.report());return true;}
}
registerProcessor('scratch-mix',P);`;

let ac=null,initing=null,audioReady=false,send=()=>{};
let comp,scratchIn,bgmBus,noiseBuf;
const rep={d:new Float32Array(NV*2),t:0,have:false};
function onReport(d){rep.d=d;rep.t=performance.now();rep.have=true;}
function voicePos(i){if(!rep.have)return 0;return rep.d[i*2]+rep.d[i*2+1]*(performance.now()-rep.t)/1000*SR;}
function voiceVel(i){return rep.have?rep.d[i*2+1]:0;}

function ensureCtx(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ac=new AC({latencyHint:"interactive"});ac.onstatechange=soundUI;}
  if(ac.state!=="running"){try{ac.resume();}catch(e){}}
  try{const b=ac.createBuffer(1,1,ac.sampleRate),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}
  soundUI();
}
function soundUI(){const on=!!ac&&ac.state==="running";$("soundBtn").setAttribute("aria-pressed",on);$("soundBtn").lastChild.textContent=on?"SOUND ON":"소리 켜기";}
["touchend","pointerup","click","keydown"].forEach(t=>addEventListener(t,()=>{ensureCtx();initAudio();},{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ac&&ac.state!=="running"){try{ac.resume();}catch(e){}}});

/* ---------- FX chain for the scratch bus ---------- */
const fx={reverb:false,delay:false,filter:false,crush:false};
let fxN={};
function makeIR(sec){const len=Math.floor(ac.sampleRate*sec),ir=ac.createBuffer(2,len,ac.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++){const t=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-t,2.4)*(i<90?i/90:1);}}return ir;}
function crushCurve(){const n=2048,c=new Float32Array(n),steps=10;for(let i=0;i<n;i++){const x=i/(n-1)*2-1,d=Math.tanh(x*2.6);c[i]=Math.round(d*steps)/steps;}return c;}
function buildFX(){
  scratchIn=ac.createGain();
  // crush (dry/wet)
  const crDry=ac.createGain(),crWet=ac.createGain(),ws=ac.createWaveShaper();ws.curve=crushCurve();ws.oversample="none";
  const crLP=ac.createBiquadFilter();crLP.type="lowpass";crLP.frequency.value=5200;
  const afterCr=ac.createGain();
  scratchIn.connect(crDry).connect(afterCr);scratchIn.connect(ws).connect(crLP).connect(crWet).connect(afterCr);
  // speed-reactive filter
  const flt=ac.createBiquadFilter();flt.type="lowpass";flt.frequency.value=20000;flt.Q.value=6;
  afterCr.connect(flt);
  const dry=ac.createGain();flt.connect(dry).connect(comp);
  // reverb
  const rvSend=ac.createGain();rvSend.gain.value=0;const conv=ac.createConvolver();conv.buffer=makeIR(3.2);
  const rvHP=ac.createBiquadFilter();rvHP.type="highpass";rvHP.frequency.value=200;
  flt.connect(rvSend).connect(rvHP).connect(conv).connect(comp);
  // ping-pong delay
  const dlSend=ac.createGain();dlSend.gain.value=0;const dL=ac.createDelay(2),dR=ac.createDelay(2),fb=ac.createGain(),fbLP=ac.createBiquadFilter();
  fbLP.type="lowpass";fbLP.frequency.value=3000;fb.gain.value=.45;
  const mg=ac.createChannelMerger(2);flt.connect(dlSend).connect(dL);dL.connect(dR);dR.connect(fbLP).connect(fb).connect(dL);
  dL.connect(mg,0,0);dR.connect(mg,0,1);const dOut=ac.createGain();dOut.gain.value=.85;mg.connect(dOut).connect(comp);
  const d2r=ac.createGain();d2r.gain.value=.3;dOut.connect(d2r).connect(rvSend);
  fxN={crDry,crWet,flt,rvSend,dlSend,dL,dR};
  applyFX(true);
}
function applyFX(now){
  if(!ac||!fxN.flt)return;const t=ac.currentTime,k=now?.001:.05;
  fxN.crWet.gain.setTargetAtTime(fx.crush?.9:0,t,k);fxN.crDry.gain.setTargetAtTime(fx.crush?.15:1,t,k);
  fxN.rvSend.gain.setTargetAtTime(fx.reverb?.75:0,t,k);
  fxN.dlSend.gain.setTargetAtTime(fx.delay?.5:0,t,k);
  const dt=Math.min(1.9,60/bgm.bpm*.75);fxN.dL.delayTime.setTargetAtTime(dt,t,.05);fxN.dR.delayTime.setTargetAtTime(dt,t,.05);
  if(!fx.filter)fxN.flt.frequency.setTargetAtTime(20000,t,.05);
}

function initAudio(){
  if(initing)return initing;
  initing=(async()=>{
    ensureCtx();if(!ac)return;SR=ac.sampleRate;
    comp=ac.createDynamicsCompressor();comp.threshold.value=-12;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.15;
    const master=ac.createGain();master.gain.value=.95;comp.connect(master).connect(ac.destination);
    bgmBus=ac.createGain();bgmBus.gain.value=.55;bgmBus.connect(comp);

/* =============== BGM: built-in boom bap loop or the player's own track =============== */
const bgm={on:false,src:"loop",bpm:90,step:0,bar:0,nextT:0,gridT0:0,timer:null,trackSrc:null,trackStart:0,trackFrom:0};
const ROOTS=[48,48,44,46];  // C, C, Ab, Bb
const midiHz=m=>440*Math.pow(2,(m-69)/12);
function dKick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(44,t+.12);
  g.gain.setValueAtTime(1,t);g.gain.exponentialRampToValueAtTime(.001,t+.42);o.connect(g).connect(bgmBus);o.start(t);o.stop(t+.44);}
function dSnare(t){const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1900;bp.Q.value=.7;
  const g=ac.createGain();g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);n.connect(bp).connect(g).connect(bgmBus);n.start(t,Math.random()*.5);n.stop(t+.22);
  const o=ac.createOscillator(),g2=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);

    o.connect(g);o2.connect(g2).connect(g);g.connect(bgmBus);o.start(t);o2.start(t);o.stop(t+d+.05);o2.stop(t+d+.05);}

const KICK=new Set([0,7,10]),SNARE=new Set([4,12]);

function sched(){
  while(bgm.nextT<ac.currentTime+.12){playStep(bgm.step,bgm.nextT,bgm.bar);bgm.nextT+=e16();bgm.step++;if(bgm.step===16){bgm.step=0;bgm.bar++;}}

function startBgm(){

    bgm.trackSrc=src;bgm.trackStart=T;bgm.trackFrom=my.resume%my.buf.duration;bgm.bpm=my.bpm;

function trackNow(){if(!bgm.trackSrc)return my.resume||0;return (bgm.trackFrom+(ac.currentTime-bgm.trackStart))%my.buf.duration;}

function heard(){return ac.currentTime-(ac.outputLatency||0)-(ac.baseLatency||0);}

/* =============== my track: tempo + beat-aligned slices =============== */
function analyzeTempo(a,b,sr,len){
  const hop=512,N=Math.min(len,sr*120),M=Math.floor(N/hop),fps=sr/hop;
  const eAll=new Float32Array(M),eLow=new Float32Array(M);let lp=0;const k=1-Math.exp(-2*Math.PI*150/sr);
  for(let m=0;m<M;m++){let s=0,sl=0;for(let i=m*hop,e=(m+1)*hop;i<e;i++){const x=(a[i]+b[i])*.5;lp+=k*(x-lp);s+=x*x;sl+=lp*lp;}eAll[m]=Math.log(1+1000*s);eLow[m]=Math.log(1+3000*sl);}
  const on=new Float32Array(M),onL=new Float32Array(M);
  for(let m=1;m<M;m++){onL[m]=Math.max(0,eLow[m]-eLow[m-1]);on[m]=Math.max(0,eAll[m]-eAll[m-1])+onL[m];}
  const W=Math.round(fps*.5);let acc=0;const det=new Float32Array(M);
  for(let m=0;m<M;m++){acc+=on[m];if(m>=W)acc-=on[m-W];det[m]=Math.max(0,on[m]-acc/Math.min(m+1,W));}
  const val=(arr,t)=>{const i=t|0,f=t-i;return i+1<M?arr[i]*(1-f)+arr[i+1]*f:0;};
  function comb(bpm,arr){const per=60/bpm*fps;let best=-1,bp=0;for(let p=0;p<per;p+=.5){let s=0,n=0;for(let t=p;t<M-1;t+=per){s+=val(arr,t);n++;}s/=n;if(s>best){best=s;bp=p;}}return [best,bp,per];}
  let bb=-1,bbpm=90;for(let bpm=70;bpm<140;bpm+=.5){const [s]=comb(bpm,det);if(s>bb){bb=s;bbpm=bpm;}}
  for(let bpm=bbpm-.6;bpm<=bbpm+.6;bpm+=.02){const [s]=comb(bpm,det);if(s>bb){bb=s;bbpm=bpm;}}
  const [,bp,per]=comb(bbpm,det);let bestJ=0,bs=-1;
  for(let j=0;j<4;j++){let s=0,n=0;for(let t=bp+j*per;t<M-1;t+=per*4){s+=val(onL,t);n++;}s/=n;if(s>bs){bs=s;bestJ=j;}}
  return {bpm:bbpm,offset:((bp+bestJ*per)/fps)%(60/bbpm*4)};
}
const my={buf:null,bpm:90,offset:0,next:0,resume:0,name:""};
function mySlice(){
  const ab=my.buf,Q=60/my.bpm,L=Math.round(SR*REV),o=new Float32Array(L),pre=Math.round(PRE*SR);
  let t;
  if(bgm.on&&bgm.src==="my"){const now=trackNow();t=my.offset+Math.floor((now-my.offset)/Q)*Q;}   // grab the beat that is playing right now
  else{t=my.offset+my.next*Q;my.next+=2;}
  if(t<0)t+=Q;if(t>ab.duration-REV){t=my.offset;my.next=2;}
  const a=ab.getChannelData(0),b=ab.numberOfChannels>1?ab.getChannelData(1):a,ratio=ab.sampleRate/SR,start=Math.round(t*ab.sampleRate);
  for(let i=0;i<L-pre;i++){const j=start+Math.floor(i*ratio);if(j>=ab.length)break;o[pre+i]=(a[j]+b[j])*.5*Math.min(1,i/(.004*SR))*Math.min(1,(L-pre-i)/(.02*SR));}
  samples.MY=normalize(o);

}
$("file").addEventListener("change",async e=>{

/* the 3x3 lattice is the instrument: each node holds a sample */
const G=.235;
const SLOTS=[];   // index order matches base[]
const LAYOUT={"-1,1":"HAT","0,1":"YEAH","1,1":"CLAP","-1,0":"STAB","0,0":"AHH","1,0":"HORN","-1,-1":"KICK","0,-1":"MY","1,-1":"SNARE"};

let base=[],blooms=[],ripples=[];
function makeBase(){
  base=[];SLOTS.length=0;let n=0;
  for(let j=1;j>=-1;j--)for(let i=-1;i<=1;i++){
    const green=(i+j)%2!==0,name=LAYOUT[i+","+j];
    base.push({hx:i*G,hy:j*G,x:i*G,y:j*G,vx:0,vy:0,bias:green?.03:0,type:green?1:0,ph:Math.random()*6.28,lift:0,hot:0,phase:0});
    SLOTS.push({name,label:name==="MY"?"＋MY":name,sub:"",key:KEYS[n++],drum:["KICK","SNARE","CLAP","HAT"].includes(name)});
  }
}
makeBase();
const MY_SLOT=SLOTS.findIndex(s=>s.name==="MY");
const samples={};

let cw=1,ch=1,W=1,Hh=1;
function resize(){const dpr=Math.min(devicePixelRatio||1,2);cw=innerWidth;ch=innerHeight;W=cv.width=Math.round(cw*dpr);Hh=cv.height=Math.round(ch*dpr);if(gl)gl.viewport(0,0,W,Hh);renderLabels();}
const toField=(cx,cy)=>{const m=Math.min(cw,ch);return [(cx-cw/2)/m,-(cy-ch/2)/m];};
const toScreen=(x,y)=>{const m=Math.min(cw,ch);return [cw/2+x*m,ch/2-y*m];};
function push(x,y,s){s*=CFG.push;for(const b of base){const dx=b.x-x,dy=b.y-y,d=Math.hypot(dx,dy)+.04,f=s*.05/(d*d);b.vx+=dx/d*f;b.vy+=dy/d*f;}}
function addRipple(x,y,amp){ripples.push({x,y,age:0,amp});if(ripples.length>MAXR)ripples.shift();}

function renderLabels(){
  const box=$("labels");
  if(!box.childElementCount)SLOTS.forEach((s,i)=>{const d=document.createElement("div");d.className="lbl";d.id="lbl"+i;box.appendChild(d);});
  const m=Math.min(cw,ch);
  SLOTS.forEach((s,i)=>{const b=base[i],[x,y]=toScreen(b.hx,b.hy),d=$("lbl"+i);
    d.style.left=x+"px";d.style.top=(y+m*.072)+"px";
    d.innerHTML=`${s.label}<small>${s.sub||s.key}</small>`;});
}

/* =============== touches: grab a sample and drag to scratch =============== */
const voices=Array.from({length:NV},()=>({busy:false,pid:null,slot:-1,t:0}));
const touches=new Map();     // pointerId -> state
const cutters=new Set(),keyCut=new Set();
const cutOpen=()=>cutters.size===0&&keyCut.size===0;
let wasOpen=true;
function faderChanged(){const o=cutOpen();if(o!==wasOpen){wasOpen=o;send({type:"fader",v:o?1:0});for(const t of touches.values())if(t.kind==="scratch"&&!o)t.cuts++;}}
function pickVoice(){let v=voices.findIndex(x=>!x.busy);if(v<0){let o=0;voices.forEach((x,i)=>{if(x.t<voices[o].t)o=i;});v=o;}return v;}
function slotAt(x,y){let best=-1,bd=.105;base.forEach((b,i)=>{const d=Math.hypot(x-b.x,y-b.y);if(d<bd){bd=d;best=i;}});return best;}
function loadVoice(v,slot){const name=SLOTS[slot].name;if(name==="MY"){if(!my.buf)return false;mySlice();}
  const buf=samples[name];if(!buf)return false;send({i:v,type:"buf",data:buf.slice()});return true;}
function playOnce(slot){
  const v=pickVoice();voices[v].t=performance.now();
  if(!loadVoice(v,slot))return;
  send({i:v,type:"setpos",pos:Math.round(PRE*SR*.9),vel:1});send({i:v,type:"hand",grab:false,hand:0,hv:0});send({i:v,type:"motor",on:true});
}
function bloomAt(x,y,type){
  if(blooms.length>=MAXP-base.length)blooms.shift();
  const bl={x,y,tx:x,ty:y,age:0,held:true,rel:0,type,bias:.3,relFrom:0,heat:0,phase:0,hold:0};
  blooms.push(bl);return bl;
}
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();cv.setPointerCapture(e.pointerId);hideHint();
  const [x,y]=toField(e.clientX,e.clientY),slot=slotAt(x,y);
  const bl=bloomAt(x,y,slot>=0?base[slot].type:(Math.random()<.3?1:0));
  addRipple(x,y,1.1);push(x,y,1);
  if(slot>=0&&SLOTS[slot].name==="MY"&&!my.buf){touches.set(e.pointerId,{kind:"file",bl});return;}
  if(slot>=0){
    const v=pickVoice();voices[v]={busy:true,pid:e.pointerId,slot,t:performance.now()};
    base[slot].lift=1;
    const st={kind:"scratch",bl,slot,v,x0:e.clientX,y0:e.clientY,lx:e.clientX,ly:e.clientY,axis:null,hand:Math.round(PRE*SR*.9),prev:0,hv:0,moved:0,t0:performance.now(),
      dir:0,ext:0,extT:0,cuts:0,ready:false};
    st.prev=st.hand;
    if(audioReady){st.ready=loadVoice(v,slot);send({i:v,type:"setpos",pos:st.hand,vel:0});send({i:v,type:"hand",grab:true,hand:st.hand,hv:0});}
    else initAudio().then(()=>{if(touches.get(e.pointerId)===st){st.ready=loadVoice(v,slot);send({i:v,type:"setpos",pos:st.hand,vel:0});send({i:v,type:"hand",grab:true,hand:st.hand,hv:0});}});
    touches.set(e.pointerId,st);
    return;
  }
  // empty space: CUT while held
  touches.set(e.pointerId,{kind:"cut",bl});cutters.add(e.pointerId);faderChanged();
});
cv.addEventListener("pointermove",e=>{
  const st=touches.get(e.pointerId);if(!st)return;
  const [x,y]=toField(e.clientX,e.clientY);st.bl.tx=x;st.bl.ty=y;
  if(st.kind!=="scratch")return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  const spp=SR*1.15/Math.min(cw,ch);  // a full screen-height drag ≈ 1.15 s of sample
  for(const ev of (evs.length?evs:[e])){
    const dx=ev.clientX-st.lx,dy=ev.clientY-st.ly;st.lx=ev.clientX;st.ly=ev.clientY;
    if(!st.axis){const tx=ev.clientX-st.x0,ty=ev.clientY-st.y0,d=Math.hypot(tx,ty);if(d>7){st.axis=[tx/d,ty/d];st.hand+=d*spp;}continue;}
    st.hand+=(dx*st.axis[0]+dy*st.axis[1])*spp;st.moved+=Math.hypot(dx,dy);
  }
  if(Math.hypot(x-st.bl.x,y-st.bl.y)>.004)push(x,y,.12);
});
function release(e){
  const st=touches.get(e.pointerId);if(!st)return;touches.delete(e.pointerId);
  const bl=st.bl;bl.held=false;bl.relFrom=bl.bias;bl.heatFrom=bl.heat;
  addRipple(bl.x,bl.y,.6+1.4*bl.heat);push(bl.x,bl.y,.6+2*bl.heat);
  if(st.kind==="cut"){cutters.delete(e.pointerId);faderChanged();return;}
  if(st.kind==="file"){$("file").click();return;}
  base[st.slot].lift=0;
  const v=st.v;voices[v].busy=false;voices[v].t=performance.now();
  if(!st.axis&&performance.now()-st.t0<450){   // a tap: play the sample once
    base[st.slot].hot=1;base[st.slot].phase-=1;
    send({i:v,type:"hand",grab:false,hand:st.hand,hv:0});send({i:v,type:"setpos",pos:Math.round(PRE*SR*.9),vel:1});send({i:v,type:"motor",on:true});
  }else{endStroke(st);send({i:v,type:"hand",grab:false,hand:st.hand,hv:st.hv});send({i:v,type:"motor",on:st.hv>.15});}
}
cv.addEventListener("pointerup",release);cv.addEventListener("pointercancel",release);
cv.addEventListener("contextmenu",e=>e.preventDefault());

/* strokes on the beat build a combo */
let combo=0,lastStroke=0;
function endStroke(st){
  if(!st.dir)return;
  const len=Math.abs(st.ext-st.start)/SR;st.dir=0;if(len<.03)return;
  const now=performance.now();if(now-lastStroke>2500)combo=0;lastStroke=now;
  if(audioReady&&bgm.on){
    const e8=30/bgm.bpm,rel=(st.extT-bgm.gridT0)/e8,off=Math.abs(rel-Math.round(rel))*e8;
    if(off<.06){combo++;st.bl.heat=Math.min(1,st.bl.heat+.35);addRipple(st.bl.x,st.bl.y,1.2);base[st.slot].hot=1;}
    else combo=Math.max(0,combo-1);
  }
  const c=$("combo");c.textContent="COMBO "+combo;c.classList.toggle("hot",combo>=8);
}

/* keyboard */
addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.code==="Space"){e.preventDefault();keyCut.add(e.code);faderChanged();return;}
  const i=KEYS.indexOf(e.key);if(i<0)return;hideHint();
  if(SLOTS[i].name==="MY"&&!my.buf){$("file").click();return;}
  const b=base[i];addRipple(b.x,b.y,1);push(b.x,b.y,.8);b.hot=1;b.phase-=1;
  initAudio().then(()=>playOnce(i));
});
addEventListener("keyup",e=>{if(keyCut.delete(e.code))faderChanged();});
addEventListener("blur",()=>{keyCut.clear();faderChanged();});

/* =============== controls =============== */
$("soundBtn").addEventListener("click",()=>{ensureCtx();initAudio();});
$("bgmBtn").addEventListener("click",async()=>{ensureCtx();await initAudio();bgm.on?stopBgm():startBgm();});
$("srcLoop").addEventListener("click",async()=>{await initAudio();bgm.src="loop";bgm.bpm=bgm.loopBpm||90;if(bgm.on)startBgm();bgmUI();applyFX();});
$("srcMy").addEventListener("click",async()=>{if(!my.buf)return;await initAudio();bgm.loopBpm=bgm.src==="loop"?bgm.bpm:bgm.loopBpm;bgm.src="my";bgm.bpm=my.bpm;if(bgm.on)startBgm();bgmUI();applyFX();});
function setLoopBpm(v){if(bgm.src!=="loop")return;const was=bgm.bpm;bgm.bpm=Math.max(70,Math.min(110,v));bgm.loopBpm=bgm.bpm;
  if(bgm.on&&ac){bgm.gridT0=bgm.nextT-(bgm.step+bgm.bar*16)*e16();}bgmUI();applyFX();}
$("bpmDown").addEventListener("click",()=>setLoopBpm(bgm.bpm-2));
$("bpmUp").addEventListener("click",()=>setLoopBpm(bgm.bpm+2));
document.querySelectorAll("[data-fx]").forEach(b=>b.addEventListener("click",async()=>{
  const k=b.dataset.fx;fx[k]=!fx[k];b.setAttribute("aria-pressed",fx[k]);ensureCtx();await initAudio();applyFX();
  toast(`${k.toUpperCase()} ${fx[k]?"켬":"끔"}`);}));
let hintOpen=true;
function hideHint(){if(hintOpen){hintOpen=false;$("hint").hidden=true;}}
$("helpBtn").addEventListener("click",()=>{hintOpen=!hintOpen;$("hint").hidden=!hintOpen;});
$("startBtn").addEventListener("click",async()=>{hideHint();ensureCtx();await initAudio();if(!bgm.on)startBgm();});
const toastEl=$("toast");let toastT;
function toast(s){toastEl.textContent=s;toastEl.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove("show"),1800);}

/* =============== frame loop =============== */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const P=new Float32Array(MAXP*4),Q=new Float32Array(MAXP*4),R=new Float32Array(MAXR*4);
let last=performance.now(),T=0,lastBeat=-1;
function frame(now){
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  // scratch hands → audio, stroke tracking
  let maxSpeed=0;
  for(const st of touches.values()){
    if(st.kind!=="scratch")continue;
    const hv=(st.hand-st.prev)/(dt*SR||1);st.hv=st.hv*.35+hv*.65;
    const d=st.hand-st.prev;
    if(Math.abs(d)>SR*.002){const dir=Math.sign(d);
      if(!st.dir){st.dir=dir;st.start=st.prev;st.ext=st.prev;}
      else if(dir!==st.dir){const ext=st.ext;endStroke(st);st.dir=dir;st.start=ext;st.ext=ext;addRipple(st.bl.x,st.bl.y,.5);}
    }
    if(st.dir&&(st.hand-st.ext)*st.dir>0){st.ext=st.hand;st.extT=audioReady?heard():0;}
    st.prev=st.hand;
    if(audioReady)send({i:st.v,type:"hand",grab:true,hand:st.hand,hv:st.hv});
    const sp=Math.abs(st.hv);maxSpeed=Math.max(maxSpeed,cutOpen()?sp:0);
    st.bl.heat+=((Math.min(1,sp/2.5))-st.bl.heat)*Math.min(1,dt*6);
    st.bl.phase=-st.hand/SR*2.4;
  }
  if(fx.filter&&fxN.flt){fxN.flt.frequency.setTargetAtTime(Math.min(18000,320+maxSpeed*3800),ac.currentTime,.03);}
  // beat pulse from the BGM
  if(audioReady&&bgm.on){const b=Math.floor((heard()-bgm.gridT0)/(60/bgm.bpm));if(b!==lastBeat&&b>=0){lastBeat=b;
    if(!reduce)addRipple(0,0,b%4===0?.45:.2);for(const x of base)x.hot=Math.max(x.hot,b%4===0?.25:.12);}}
  // lattice springs
  for(const b of base){
    b.vx+=((b.hx-b.x)*38-b.vx*7.5)*dt;b.vy+=((b.hy-b.y)*38-b.vy*7.5)*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
    b.hot*=Math.exp(-dt/.35);b.phase+=dt*(.2+3*b.hot);
  }
  // live voices keep their node's rings moving
  voices.forEach((v,i)=>{if(v.slot>=0&&!v.busy&&Math.abs(voiceVel(i))>.05)base[v.slot].hot=Math.max(base[v.slot].hot,.35);});
  const sink=.35/CFG.linger;
  for(const bl of blooms){
    bl.age+=dt;bl.x+=(bl.tx-bl.x)*Math.min(1,dt*14);bl.y+=(bl.ty-bl.y)*Math.min(1,dt*14);
    const tb=bl.type?.03:0;
    if(bl.held){bl.hold+=dt;const a=Math.min(bl.age/.7,1),el=1-Math.pow(2,-9*a)*Math.cos(a*Math.PI*3.2);
      const target=tb-.05*(1-Math.exp(-bl.hold/1.5))-.02*bl.heat;bl.bias=.3+(target-.3)*el;push(bl.x,bl.y,dt*1.4*bl.heat);}
    else{bl.rel+=dt;bl.bias=bl.relFrom+bl.rel*sink;bl.heat=(bl.heatFrom||0)*Math.exp(-bl.rel*3/CFG.linger);bl.phase+=dt*(1.2+5*bl.heat);}
  }
  blooms=blooms.filter(b=>b.held||b.bias<.36);
  for(const r of ripples)r.age+=dt;ripples=ripples.filter(r=>r.age<2.8);
  if(gl&&U.uRes){
    let n=0;const br=reduce?0:.004*CFG.breath;
    for(const b of base){const lift=b.lift*.05;
      P[n*4]=b.x;P[n*4+1]=b.y;P[n*4+2]=b.bias+lift+Math.sin(T*.9+b.ph)*br-b.hot*.012;P[n*4+3]=b.type;
      Q[n*4]=b.hot*.5;Q[n*4+1]=Math.cos(b.phase*6.2831853);Q[n*4+2]=Math.sin(b.phase*6.2831853);n++;}
    for(const bl of blooms){if(n>=MAXP)break;P[n*4]=bl.x;P[n*4+1]=bl.y;P[n*4+2]=bl.bias;P[n*4+3]=bl.type;
      Q[n*4]=bl.heat;Q[n*4+1]=Math.cos(bl.phase*6.2831853);Q[n*4+2]=Math.sin(bl.phase*6.2831853);n++;}
    ripples.forEach((r,i)=>{R[i*4]=r.x;R[i*4+1]=r.y;R[i*4+2]=r.age;R[i*4+3]=reduce?0:r.amp*CFG.ripple;});
    gl.uniform2f(U.uRes,W,Hh);gl.uniform1f(U.uTime,T);gl.uniform1f(U.uFlow,reduce?0:CFG.flow);gl.uniform1f(U.uK,CFG.k);gl.uniform1f(U.uDen,CFG.density);
    gl.uniform1f(U.uTi,CFG.inner);gl.uniform1f(U.uTc,CFG.core);gl.uniform1f(U.uLine,CFG.line);
    gl.uniform3fv(U.cField,PAL.field);gl.uniform3fv(U.cOuter,PAL.outer);gl.uniform3fv(U.cDark,PAL.dark);gl.uniform3fv(U.cLine,PAL.line);gl.uniform3fv(U.cLineDim,PAL.lineDim);
    gl.uniform3fv(U.cCoreA,PAL.coreA);gl.uniform3fv(U.cCoreB,PAL.coreB);gl.uniform3fv(U.cCoreLine,PAL.coreLine);gl.uniform3fv(U.cHot1,PAL.hot1);gl.uniform3fv(U.cHot2,PAL.hot2);
    gl.uniform4fv(U.uQ,Q);gl.uniform4fv(U.uP,P);gl.uniform1i(U.uN,n);gl.uniform4fv(U.uR,R);gl.uniform1i(U.uRN,ripples.length);
    gl.drawArrays(gl.TRIANGLES,0,3);
  }
  // labels follow their nodes
  const m=Math.min(cw,ch);
  base.forEach((b,i)=>{const d=$("lbl"+i);if(!d)return;const [x,y]=toScreen(b.x,b.y);d.style.transform=`translate(calc(-50% + ${x-parseFloat(d.style.left)}px), ${y+m*.072-parseFloat(d.style.top)}px)`;
    d.classList.toggle("live",b.lift>0);d.style.opacity=b.lift>0?.35:1;});
  requestAnimationFrame(frame);
}
addEventListener("resize",resize);
resize();bgmUI();
requestAnimationFrame(frame);
})();
</script>
