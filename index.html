<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Scratch Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one full-bleed contour field; nine blobs are the instrument (center = scratch, corners = drums, droplets = samples). Single look by choice. */
:root{
  --field:#1f9a4a;
  --ink:#eef6d2;
  --lime:#cde65c;
  --night:#0a100c;
  --teal:#1c8fb0;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;background:var(--field);color:var(--ink)}
body{margin:0;overflow:hidden;font-family:var(--mono);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lbl{position:fixed;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.7),0 0 8px rgba(0,0,0,.5);white-space:nowrap;line-height:1.3}
.lbl small{display:block;font-size:9.5px;font-weight:500;letter-spacing:.08em;opacity:.75}
.lbl.big{font-size:12px}
.bar{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.name{font-size:12px;font-weight:600;letter-spacing:.2em;color:var(--ink);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.btns{display:flex;gap:6px}
.chip{font:inherit;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink);background:rgba(10,16,12,.72);border:1px solid rgba(205,230,92,.35);border-radius:999px;padding:6px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.chip .dot{width:7px;height:7px;border-radius:50%;background:#4a5a3a}
.chip[aria-pressed="true"] .dot{background:var(--lime);box-shadow:0 0 6px var(--lime)}
.hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%);width:min(92vw,520px);box-sizing:border-box;
  background:rgba(10,16,12,.86);border:1px solid rgba(205,230,92,.3);border-radius:14px;padding:12px 14px;font-size:12px;line-height:1.6;color:var(--ink)}
.hint b{color:var(--lime);font-weight:600}
.hint kbd{font:inherit;font-size:10.5px;border:1px solid rgba(238,246,210,.35);border-radius:4px;padding:0 4px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
</style>

</head>
<body>
<canvas id="gl" aria-label="스크래치와 드럼 패드가 있는 연주 화면"></canvas>
<div id="labels"></div>
<div class="bar">
  <span class="name">SCRATCH FIELD</span>
  <div class="btns">
    <button class="chip" id="soundBtn" aria-pressed="false"><span class="dot"></span><span>소리 켜기</span></button>
    <button class="chip" id="helpBtn" aria-expanded="true">?</button>
  </div>
</div>
<div class="hint" id="hint">
  <b>가운데 원</b>을 잡고 돌리면 스크래치. 다른 손가락으로 <b>빈 곳</b>을 누르고 있으면 소리가 끊겨요(CUT).<br>
  <b>모서리 큰 원</b> 4개는 드럼, <b>작은 물방울</b>은 샘플을 가운데로 불러와요. ＋MY는 내 음악 파일에서 한 마디씩 꺼내요.<br>
  키보드: 드럼 <kbd>D</kbd><kbd>F</kbd><kbd>J</kbd><kbd>K</kbd> · 샘플 <kbd>1</kbd>–<kbd>4</kbd> · CUT <kbd>Space</kbd>
</div>
<input class="vh" type="file" id="file" accept="audio/*,.mp3,.m4a,.wav,.aac">

<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const REV_SEC=1.8;
let SR=48000;

/* ================= sounds ================= */
function normalize(a){let m=0;for(let i=0;i<a.length;i++){const v=Math.abs(a[i]);if(v>m)m=v;}if(m>0){const g=.92/m;for(let i=0;i<a.length;i++)a[i]*=g;}return a;}
function genAhh(sr,L){const o=new Float32Array(L),st=Math.floor(.06*sr),dur=.85,n=Math.floor(dur*sr);const F=[[760,140,1],[1190,160,.55],[2520,230,.3],[3450,320,.12]];const amps=new Float32Array(48);let K=0,ph=0,seed=7;
  for(let i=0;i<n;i++){const t=i/sr,f0=190*Math.pow(.8,t/dur)+3.5*Math.sin(2*Math.PI*5.3*t);
    if(i%64===0){K=Math.min(46,Math.floor(5200/f0));for(let k=1;k<=K;k++){const fk=k*f0;let a=0;for(const [fc,bw,g] of F){const x=(fk-fc)/bw;a+=g*Math.exp(-x*x);}amps[k]=a/Math.sqrt(k);}}
    ph+=f0/sr;if(ph>1)ph-=1;let s=0;for(let k=1;k<=K;k++)s+=amps[k]*Math.sin(6.283185307*k*ph);
    seed=(seed*16807)%2147483647;s+=((seed/2147483647)-.5)*.05;
    o[st+i]=s*Math.min(1,t/.02)*(t>dur-.22?(dur-t)/.22:1)*(1-.3*t/dur);}
  return normalize(o);}
function genStab(sr,L){const o=new Float32Array(L),st=Math.floor(.06*sr),n=Math.floor(.6*sr);const notes=[130.81,261.63,311.13,392,466.16,523.25];let y=0,y2=0;
  for(let i=0;i<n;i++){const t=i/sr;let s=0;for(let j=0;j<notes.length;j++){const f=notes[j]*(1+(j%2?.004:-.003));s+=2*((t*f)%1)-1;}s/=notes.length;
    const cut=500+5200*Math.exp(-t/.11),a=1-Math.exp(-6.283*cut/sr);y+=a*(s-y);y2+=a*(y-y2);o[st+i]=y2*Math.min(1,t/.003)*Math.exp(-t/.2);}
  return normalize(o);}
function genHorn(sr,L){const o=new Float32Array(L),st=Math.floor(.06*sr),dur=.7,n=Math.floor(dur*sr);let y=0,y2=0,p1=0,p2=0;
  for(let i=0;i<n;i++){const t=i/sr,bend=t<.07?Math.pow(2,-2*(1-t/.07)/12):1,f=233.08*bend*(1+.007*Math.sin(2*Math.PI*5.6*Math.max(0,t-.15)));
    p1=(p1+f/sr)%1;p2=(p2+f*1.005/sr)%1;const s=(2*p1-1)+(2*p2-1)*.8,env=Math.min(1,t/.035)*(t>dur-.15?(dur-t)/.15:1),cut=700+2600*env*(1-.4*t),a=1-Math.exp(-6.283*cut/sr);
    y+=a*(s-y);y2+=a*(y-y2);o[st+i]=y2*env;}
  return normalize(o);}
const GEN={AHH:genAhh,STAB:genStab,HORN:genHorn};

/* ================= scratch engine ================= */
const CORE_SRC=`
class DeckCore{
  constructor(sr){this.sr=sr;this.buf=new Float32Array(1);this.L=1;this.pos=0;this.vel=0;this.grab=false;this.hand=0;this.hv=0;
    this.motor=false;this.fader=1;this.g=1;this.spin=1/(sr*.09);this.kp=1/(sr*.010);this.lp=0;}
  msg(m){
    if(m.type==='buf'){this.buf=m.data;this.L=m.data.length;}
    else if(m.type==='hand'){this.grab=m.grab;this.hand=m.hand;this.hv=m.hv;}
    else if(m.type==='fader'){this.fader=m.v;}
    else if(m.type==='motor'){this.motor=m.on;}
    else if(m.type==='setpos'){this.pos=m.pos;this.vel=m.vel||0;this.hand=m.pos;}
  }
  process(out){
    const b=this.buf,L=this.L,n=out.length;
    for(let i=0;i<n;i++){
      if(this.grab){this.hand+=this.hv;let tv=this.hv+(this.hand-this.pos)*this.kp;if(tv>12)tv=12;else if(tv<-12)tv=-12;this.vel+=(tv-this.vel)*.012;}
      else{if(this.motor&&this.pos>=L-1)this.motor=false;const tv=this.motor?1:0;this.vel+=(tv-this.vel)*this.spin*(Math.abs(tv-this.vel)>.5?3:1);}
      this.pos+=this.vel;this.g+=(this.fader-this.g)*.06;
      let s=0;const p=this.pos;
      if(p>=0&&p<L-1){const i0=p|0,fr=p-i0;s=b[i0]+(b[i0+1]-b[i0])*fr;}
      const av=Math.abs(this.vel),k=av<.4?.25+av*1.8:1;this.lp+=(s-this.lp)*k;
      out[i]=this.lp*this.g*.9;
    }
  }
}`;
const WORKLET_SRC=CORE_SRC+`
class DeckProc extends AudioWorkletProcessor{
  constructor(){super();this.c=new DeckCore(sampleRate);this.k=0;this.port.onmessage=e=>this.c.msg(e.data);}
  process(i,o){const ch=o[0]&&o[0][0];if(ch)this.c.process(ch);if((++this.k&1)===0)this.port.postMessage({pos:this.c.pos,vel:this.c.vel});return true;}
}
registerProcessor('deck-proc',DeckProc);`;

let ac=null,master=null,drumBus=null,noiseBuf=null,send=()=>{},audioReady=false,initing=null;
const rep={pos:0,vel:0,t:0,have:false};
function onReport(d){rep.pos=d.pos;rep.vel=d.vel;rep.t=performance.now();rep.have=true;}
function ensureCtx(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback";}catch(e){}
  if(!ac){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC({latencyHint:"interactive"});ac.onstatechange=soundUI;}
  if(ac.state!=="running"){try{ac.resume();}catch(e){}}
  try{const b=ac.createBuffer(1,1,ac.sampleRate),s=ac.createBufferSource();s.buffer=b;s.connect(ac.destination);s.start(0);}catch(e){}
  soundUI();
}
function soundUI(){const on=!!ac&&ac.state==="running";$("soundBtn").setAttribute("aria-pressed",on);$("soundBtn").lastChild.textContent=on?"SOUND ON":"소리 켜기";}
function initAudio(){
  if(initing)return initing;
  initing=(async()=>{
    ensureCtx();SR=ac.sampleRate;
    master=ac.createDynamicsCompressor();master.threshold.value=-8;master.ratio.value=4;master.attack.value=.002;master.release.value=.1;master.connect(ac.destination);
    drumBus=ac.createGain();drumBus.gain.value=.9;drumBus.connect(master);
    const deckGain=ac.createGain();deckGain.connect(master);
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
    let ok=false,node=null;
    try{
      if(ac.audioWorklet){
        const url=URL.createObjectURL(new Blob([WORKLET_SRC],{type:"application/javascript"}));
        await Promise.race([ac.audioWorklet.addModule(url),new Promise((_,r)=>setTimeout(()=>r(0),2500))]);
        node=new AudioWorkletNode(ac,"deck-proc",{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1]});
        node.port.onmessage=e=>onReport(e.data);node.connect(deckGain);send=m=>node.port.postMessage(m);ok=true;
      }
    }catch(e){ok=false;}
    if(ok){const t0=performance.now();while(ac.state!=="running"&&performance.now()-t0<15000)await new Promise(r=>setTimeout(r,100));
      const t1=performance.now();while(!rep.have&&performance.now()-t1<900)await new Promise(r=>setTimeout(r,50));
      if(ac.state==="running"&&!rep.have){try{node.disconnect();}catch(e){}ok=false;}}
    if(!ok){const Core=new Function(CORE_SRC+";return DeckCore;")(),core=new Core(SR),sp=ac.createScriptProcessor(512,1,1);
      sp.onaudioprocess=e=>{core.process(e.outputBuffer.getChannelData(0));onReport({pos:core.pos,vel:core.vel});};sp.connect(deckGain);send=m=>core.msg(m);}
    for(const k in GEN)samples[k]=GEN[k](SR,Math.round(SR*REV_SEC));
    loadOnRecord(current,false);
    send({type:"fader",v:cutOpen()?1:0});
    audioReady=true;
  })();
  return initing;
}
["touchend","pointerup","click","keydown"].forEach(t=>addEventListener(t,()=>{ensureCtx();initAudio();},{capture:true,passive:true}));
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&ac&&ac.state!=="running"){try{ac.resume();}catch(e){}}});
$("soundBtn").addEventListener("click",()=>{ensureCtx();initAudio().then(()=>hit("KICK"));});

/* drums */
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(44,t+.12);
  g.gain.setValueAtTime(1.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g).connect(drumBus);o.start(t);o.stop(t+.47);
  const c=ac.createBufferSource();c.buffer=noiseBuf;const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=2500;const cg=ac.createGain();cg.gain.setValueAtTime(.35,t);cg.gain.exponentialRampToValueAtTime(.001,t+.012);c.connect(hp).connect(cg).connect(drumBus);c.start(t);c.stop(t+.02);}
function snare(t){const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1900;bp.Q.value=.7;
  const g=ac.createGain();g.gain.setValueAtTime(.85,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);n.connect(bp).connect(g).connect(drumBus);n.start(t,Math.random()*.5);n.stop(t+.24);
  const o=ac.createOscillator(),g2=ac.createGain();o.type="triangle";o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);
  g2.gain.setValueAtTime(.55,t);g2.gain.exponentialRampToValueAtTime(.001,t+.11);o.connect(g2).connect(drumBus);o.start(t);o.stop(t+.13);}
function hat(t){const n=ac.createBufferSource();n.buffer=noiseBuf;const hp=ac.createBiquadFilter();hp.type="highpass";hp.frequency.value=7400;
  const g=ac.createGain();g.gain.setValueAtTime(.42,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);n.connect(hp).connect(g).connect(drumBus);n.start(t,Math.random()*.5);n.stop(t+.07);}
function clap(t){const n=ac.createBufferSource();n.buffer=noiseBuf;const bp=ac.createBiquadFilter();bp.type="bandpass";bp.frequency.value=1300;bp.Q.value=1.1;const g=ac.createGain();
  g.gain.setValueAtTime(.0001,t);for(let i=0;i<3;i++){const s=t+i*.011;g.gain.setValueAtTime(.8,s);g.gain.exponentialRampToValueAtTime(.08,s+.009);}
  g.gain.setValueAtTime(.55,t+.034);g.gain.exponentialRampToValueAtTime(.001,t+.26);n.connect(bp).connect(g).connect(drumBus);n.start(t,Math.random()*.5);n.stop(t+.28);}
const DRUM={KICK:kick,SNARE:snare,HAT:hat,CLAP:clap};

/* ================= samples on the record ================= */
const samples={};
let current="AHH";
function loadOnRecord(name,play){
  const b=samples[name];if(!b||!audioReady&&play)return;
  send({type:"buf",data:b.slice()});
  if(play){send({type:"setpos",pos:0,vel:1});send({type:"motor",on:true});}
}

/* my track: tempo + slices */
function analyzeTempo(a,b,sr,len){
  const hop=512,N=Math.min(len,sr*120),M=Math.floor(N/hop),fps=sr/hop;
  const eAll=new Float32Array(M),eLow=new Float32Array(M);let lp=0;const k=1-Math.exp(-2*Math.PI*150/sr);
  for(let m=0;m<M;m++){let s=0,sl=0;for(let i=m*hop,e=(m+1)*hop;i<e;i++){const x=(a[i]+b[i])*.5;lp+=k*(x-lp);s+=x*x;sl+=lp*lp;}eAll[m]=Math.log(1+1000*s);eLow[m]=Math.log(1+3000*sl);}
  const on=new Float32Array(M),onL=new Float32Array(M);
  for(let m=1;m<M;m++){onL[m]=Math.max(0,eLow[m]-eLow[m-1]);on[m]=Math.max(0,eAll[m]-eAll[m-1])+onL[m];}
  const W=Math.round(fps*.5);let acc=0;const det=new Float32Array(M);
  for(let m=0;m<M;m++){acc+=on[m];if(m>=W)acc-=on[m-W];det[m]=Math.max(0,on[m]-acc/Math.min(m+1,W));}
  const val=(arr,t)=>{const i=t|0,f=t-i;return i+1<M?arr[i]*(1-f)+arr[i+1]*f:0;};
  function comb(bpm,arr){const per=60/bpm*fps;let best=-1,bp=0;for(let p=0;p<per;p+=.5){let s=0,n=0;for(let t=p;t<M-1;t+=per){s+=val(arr,t);n++;}s/=n;if(s>best){best=s;bp=p;}}return [best,bp,per];}
  let bb=-1,bbpm=90;for(let bpm=70;bpm<140;bpm+=.5){const [s]=comb(bpm,det);if(s>bb){bb=s;bbpm=bpm;}}
  for(let bpm=bbpm-.6;bpm<=bbpm+.6;bpm+=.02){const [s]=comb(bpm,det);if(s>bb){bb=s;bbpm=bpm;}}
  const [,bp,per]=comb(bbpm,det);let bestJ=0,bs=-1;
  for(let j=0;j<4;j++){let s=0,n=0;for(let t=bp+j*per;t<M-1;t+=per*4){s+=val(onL,t);n++;}s/=n;if(s>bs){bs=s;bestJ=j;}}
  return {bpm:bbpm,offset:((bp+bestJ*per)/fps)%(60/bbpm*4)};
}
const my={buf:null,bpm:90,offset:0,next:0,name:""};
function mySlice(){
  const ab=my.buf,Q=60/my.bpm,L=Math.round(SR*REV_SEC),o=new Float32Array(L),pre=Math.round(.03*SR);
  let t=my.offset+my.next*Q;if(t>ab.duration-REV_SEC){my.next=0;t=my.offset;}
  my.next+=2;
  const a=ab.getChannelData(0),b=ab.numberOfChannels>1?ab.getChannelData(1):a,ratio=ab.sampleRate/SR,start=Math.round(t*ab.sampleRate);
  for(let i=0;i<L-pre;i++){const j=start+Math.floor(i*ratio);if(j>=ab.length)break;o[pre+i]=(a[j]+b[j])*.5*Math.min(1,i/(.004*SR))*Math.min(1,(L-pre-i)/(.02*SR));}
  samples.MY=normalize(o);
  const m=Math.floor(t/60),s=Math.floor(t%60).toString().padStart(2,"0");
  pads.MY.sub=`${m}:${s}`;
}
$("file").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  await initAudio();pads.MY.sub="불러오는 중";renderLabels();
  try{
    const arr=await f.arrayBuffer();
    const ab=await new Promise((res,rej)=>{const p=ac.decodeAudioData(arr,res,rej);if(p&&p.then)p.then(res,rej);});
    const a=ab.getChannelData(0),b=ab.numberOfChannels>1?ab.getChannelData(1):a;
    const r=analyzeTempo(a,b,ab.sampleRate,ab.length);
    Object.assign(my,{buf:ab,bpm:r.bpm,offset:r.offset,next:0,name:f.name});
    pads.MY.label="MY";summon("MY");
  }catch(err){pads.MY.sub="열 수 없는 파일";}
  renderLabels();e.target.value="";
});

/* ================= instrument layout ================= */
// u,v in a centered square (0..1); r relative to square size
const pads={
  SCRATCH:{kind:"scratch",u:.5, v:.5, r:.115,label:"SCRATCH",col:[.11,.56,.69]},
  HAT:    {kind:"drum",u:.23,v:.23,r:.092,label:"HAT",key:"D",col:[.12,.58,.70]},
  CLAP:   {kind:"drum",u:.77,v:.23,r:.092,label:"CLAP",key:"K",col:[.12,.58,.70]},
  KICK:   {kind:"drum",u:.23,v:.77,r:.092,label:"KICK",key:"F",col:[.12,.58,.70]},
  SNARE:  {kind:"drum",u:.77,v:.77,r:.092,label:"SNARE",key:"J",col:[.12,.58,.70]},
  AHH:    {kind:"sample",u:.5, v:.2, r:.05,label:"AHH",key:"1",col:[.16,.66,.36]},
  STAB:   {kind:"sample",u:.2, v:.5, r:.05,label:"STAB",key:"2",col:[.16,.66,.36]},
  HORN:   {kind:"sample",u:.8, v:.5, r:.05,label:"HORN",key:"3",col:[.16,.66,.36]},
  MY:     {kind:"sample",u:.5, v:.8, r:.05,label:"＋MY",key:"4",col:[.16,.66,.36]}
};
const ORDER=["SCRATCH","HAT","CLAP","KICK","SNARE","AHH","STAB","HORN","MY"];
for(const k of ORDER)Object.assign(pads[k],{pulse:0,phase:0,phTarget:0,x:0,y:0,R:0,sub:""});
pads.SCRATCH.sub="AHH";

let W=0,H=0,DPR=1,S=0,OX=0,OY=0;
function layout(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,devicePixelRatio||1);
  const top=48, bottom=Math.min(110,H*.14);
  S=Math.min(W,H-top-bottom)*1.0;S=Math.max(S,Math.min(W,H)*.8);
  OX=(W-S)/2;OY=top+(H-top-bottom-S)/2;if(OY<0)OY=(H-S)/2;
  for(const k of ORDER){const p=pads[k];p.x=OX+p.u*S;p.y=OY+p.v*S;p.R=p.r*S;}
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  if(gl)gl.viewport(0,0,cv.width,cv.height);
  renderLabels();
}
function renderLabels(){
  const box=$("labels");
  if(!box.childElementCount)for(const k of ORDER){const d=document.createElement("div");d.className="lbl"+(k==="SCRATCH"?" big":"");d.id="l-"+k;box.appendChild(d);}
  for(const k of ORDER){const p=pads[k],d=$("l-"+k);
    d.style.left=p.x+"px";d.style.top=(p.kind==="sample"?p.y:p.y+p.R*1.55)+"px";
    if(p.kind==="sample"){d.style.top=(p.y+p.R*1.9)+"px";}
    d.innerHTML=`${p.label}${p.sub?`<small>${p.sub}</small>`:p.key?`<small>${p.key}</small>`:""}`;}
}

/* ================= field renderer ================= */
const cv=$("gl");
let gl=cv.getContext("webgl2",{antialias:false,premultipliedAlpha:false});let isGL2=!!gl;
if(!gl){gl=cv.getContext("webgl");if(gl&&!gl.getExtension("OES_standard_derivatives"))gl=null;}
let prog=null,uRes,uB,uC;
if(gl){
  const head=isGL2?"#version 300 es\nprecision highp float;\nout vec4 o;\n":"#extension GL_OES_standard_derivatives : enable\nprecision highp float;\n";
  const FS=head+`
uniform vec2 uRes;uniform vec4 uB[9];uniform vec4 uC[9];
void main(){
  vec2 p=gl_FragCoord.xy;p.y=uRes.y-p.y;
  float v=0.,ws=0.,ph=0.,nr=0.,glow=0.;vec3 cc=vec3(0.);
  for(int i=0;i<9;i++){
    vec2 d=p-uB[i].xy;float dist=max(length(d),1.);float k=uB[i].z/dist;float k2=k*k;
    v+=k2;float w=k2*k2*k2;ws+=w;ph+=w*uB[i].w;cc+=w*uC[i].rgb;glow+=w*uC[i].a;nr=max(nr,k);
  }
  ph/=ws;cc/=ws;glow/=ws;
  float s=sqrt(v);
  float tt=s<1.?s:2.-1./s;
  float t=tt*13.0+ph;
  float aa=fwidth(t);
  float dn=abs(fract(t+.5)-.5);
  float lw=.19;
  float line=1.-smoothstep(lw-aa*.75,lw+aa*.75,dn);
  line*=clamp(1.3-aa*1.6,0.,1.);
  float core=smoothstep(.97,1.03,nr);
  float mid=smoothstep(.42,.5,s)*(1.-core);
  float outerAmt=smoothstep(.12,.45,s);
  vec3 outerBg=vec3(.122,.604,.290),outerLn=vec3(.055,.32,.15);
  vec3 midBg=vec3(.035,.055,.04),midLn=vec3(.80,.90,.36);
  vec3 coreBg=cc*.28,coreLn=min(cc*(1.15+glow*.9)+glow*.25,vec3(1.));
  vec3 outerC=mix(outerBg,outerLn,line*outerAmt);
  vec3 midC=mix(midBg,midLn*(1.+glow*.4),line);
  vec3 coreC=mix(coreBg,coreLn,line);
  vec3 col=mix(outerC,midC,mid);col=mix(col,coreC,core);
  `+(isGL2?"o=vec4(col,1.);":"gl_FragColor=vec4(col,1.);")+`
}`;
  const VS=(isGL2?"#version 300 es\nin vec2 a;":"attribute vec2 a;")+"void main(){gl_Position=vec4(a,0.,1.);}";
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(o));return o;};
  try{
    prog=gl.createProgram();gl.attachShader(prog,sh(gl.VERTEX_SHADER,VS));gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(prog));
    gl.useProgram(prog);
    const bufr=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bufr);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
    const loc=gl.getAttribLocation(prog,"a");gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
    uRes=gl.getUniformLocation(prog,"uRes");uB=gl.getUniformLocation(prog,"uB");uC=gl.getUniformLocation(prog,"uC");
  }catch(e){console.error(e);gl=null;}
}
const ctx2d=gl?null:cv.getContext("2d");
const B=new Float32Array(36),C=new Float32Array(36);
function draw(){
  for(let i=0;i<9;i++){const p=pads[ORDER[i]];const grow=1+.22*p.pulse+(p.kind==="scratch"&&scr.id!==null?.06:0);
    B[i*4]=p.x*DPR;B[i*4+1]=p.y*DPR;B[i*4+2]=p.R*grow*DPR;B[i*4+3]=p.phase;
    let c=p.col;if(p.kind==="scratch"&&!cutOpen())c=[.06,.22,.28];
    C[i*4]=c[0];C[i*4+1]=c[1];C[i*4+2]=c[2];C[i*4+3]=p.pulse;}
  if(gl){gl.uniform2f(uRes,cv.width,cv.height);gl.uniform4fv(uB,B);gl.uniform4fv(uC,C);gl.drawArrays(gl.TRIANGLES,0,3);return;}
  // 2D fallback: concentric rings
  const x=ctx2d;x.setTransform(DPR,0,0,DPR,0,0);x.fillStyle="#1f9a4a";x.fillRect(0,0,W,H);
  for(const k of ORDER){const p=pads[k];for(let i=6;i>=0;i--){x.beginPath();x.arc(p.x,p.y,p.R*(1+.22*p.pulse)*(.3+i*.28),0,7);x.fillStyle=i%2?"#0a100c":`rgb(${p.col.map(v=>v*255|0)})`;x.fill();}}
}

/* ================= interaction ================= */
const scr={id:null,lastAng:0,hand:0,prevHand:0,hv:0};
const cuts=new Set(), keyCuts=new Set();
const cutOpen=()=>cuts.size===0&&keyCuts.size===0;
let wasOpen=true;
function faderChanged(){const o=cutOpen();if(o!==wasOpen){wasOpen=o;send({type:"fader",v:o?1:0});}}
function padAt(x,y){
  let best=null,bd=1e9;
  for(const k of ORDER){const p=pads[k],d=Math.hypot(x-p.x,y-p.y),reach=p.R*(p.kind==="sample"?1.6:p.kind==="scratch"?1.7:1.35);
    if(d<reach&&d/reach<bd){bd=d/reach;best=k;}}
  return best;
}
function hit(name){
  const p=pads[name];p.pulse=1;p.phTarget-=1.6;
  if(!audioReady||!ac){initAudio().then(()=>DRUM[name](ac.currentTime+.005));return;}
  DRUM[name](ac.currentTime+.005);
}
function summon(name){
  const p=pads[name];p.pulse=1;p.phTarget-=1.2;
  if(name==="MY"){if(!my.buf){$("file").click();return;}mySlice();}
  current=name;pads.SCRATCH.sub=name==="MY"?"MY "+pads.MY.sub:name;pads.SCRATCH.pulse=Math.max(pads.SCRATCH.pulse,.6);
  if(audioReady)loadOnRecord(name,true);else initAudio().then(()=>loadOnRecord(current,true));
  renderLabels();
}
let pressT={};
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();hideHint();
  const k=padAt(e.clientX,e.clientY);
  if(k==="SCRATCH"&&scr.id===null){
    cv.setPointerCapture(e.pointerId);scr.id=e.pointerId;
    const p=pads.SCRATCH;scr.lastAng=Math.atan2(e.clientY-p.y,e.clientX-p.x);
    const L=Math.round(SR*REV_SEC);let start=curPos();
    if(start<0||start>L-SR*.05){start=SR*.06;send({type:"setpos",pos:start,vel:0});}
    scr.hand=start;scr.prevHand=start;scr.hv=0;send({type:"hand",grab:true,hand:start,hv:0});
    return;
  }
  if(k&&pads[k].kind==="drum"){hit(k);return;}
  if(k&&pads[k].kind==="sample"){pressT[e.pointerId]={k,t:performance.now()};return;}
  // empty space: cut while held (useful while the other hand scratches)
  cv.setPointerCapture(e.pointerId);cuts.add(e.pointerId);faderChanged();
});
cv.addEventListener("pointermove",e=>{
  if(e.pointerId!==scr.id)return;
  const p=pads.SCRATCH,evs=e.getCoalescedEvents?e.getCoalescedEvents():[];
  for(const ev of (evs.length?evs:[e])){const a=Math.atan2(ev.clientY-p.y,ev.clientX-p.x);let d=a-scr.lastAng;
    if(d>Math.PI)d-=Math.PI*2;else if(d<-Math.PI)d+=Math.PI*2;scr.lastAng=a;scr.hand+=d/(Math.PI*2)*SR*REV_SEC;}
});
function up(e){
  if(e.pointerId===scr.id){scr.id=null;send({type:"hand",grab:false,hand:scr.hand,hv:scr.hv});if(Math.abs(scr.hv)>.2)send({type:"motor",on:scr.hv>0});}
  if(cuts.delete(e.pointerId))faderChanged();
  const pr=pressT[e.pointerId];
  if(pr){delete pressT[e.pointerId];
    if(pr.k==="MY"&&my.buf&&performance.now()-pr.t>600)$("file").click();
    else summon(pr.k);}
}
cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
cv.addEventListener("contextmenu",e=>e.preventDefault());

const KEYMAP={KeyD:"HAT",KeyF:"KICK",KeyJ:"SNARE",KeyK:"CLAP",Digit1:"AHH",Digit2:"STAB",Digit3:"HORN",Digit4:"MY"};
addEventListener("keydown",e=>{
  if(e.repeat)return;
  if(e.code==="Space"||e.code==="ShiftLeft"||e.code==="ShiftRight"){e.preventDefault();keyCuts.add(e.code);faderChanged();return;}
  const k=KEYMAP[e.code];if(!k)return;hideHint();
  if(pads[k].kind==="drum"){ensureCtx();initAudio();hit(k);}else summon(k);
});
addEventListener("keyup",e=>{if(keyCuts.delete(e.code))faderChanged();});
addEventListener("blur",()=>{keyCuts.clear();cuts.clear();faderChanged();});

function curPos(){if(!rep.have)return SR*.06;return rep.pos+rep.vel*(performance.now()-rep.t)/1000*SR;}

/* hint */
let hintShown=true;
function hideHint(){if(hintShown){hintShown=false;$("hint").hidden=true;$("helpBtn").setAttribute("aria-expanded","false");}}
$("helpBtn").addEventListener("click",()=>{hintShown=!hintShown;$("hint").hidden=!hintShown;$("helpBtn").setAttribute("aria-expanded",hintShown);});

/* ================= loop ================= */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let last=performance.now(),idle=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;idle+=dt;
  if(scr.id!==null){
    const hv=(scr.hand-scr.prevHand)/(dt*SR||1);scr.hv=scr.hv*.35+hv*.65;scr.prevHand=scr.hand;
    send({type:"hand",grab:true,hand:scr.hand,hv:scr.hv});
  }
  const pos=scr.id!==null?scr.hand:curPos();
  for(const k of ORDER){const p=pads[k];
    p.pulse*=Math.exp(-dt/.16);
    p.phase+=(p.phTarget-p.phase)*Math.min(1,dt/.09);
    if(!reduce&&p.kind!=="scratch")p.phTarget+=dt*(p.kind==="sample"?.25:.12);
  }
  // scratch rings follow the record: forward = rings flow outward
  pads.SCRATCH.phase=-pos/SR*2.2;
  const v=Math.abs(scr.id!==null?scr.hv:(rep.have?rep.vel:0));
  if(cutOpen())pads.SCRATCH.pulse=Math.max(pads.SCRATCH.pulse,Math.min(.7,v*.35));
  draw();
  requestAnimationFrame(frame);
}
addEventListener("resize",layout);
layout();
requestAnimationFrame(frame);
})();
</script>

</body>
</html>
